<!DOCTYPE html>
<html>
<head>
    <title>Mozhi API</title>
    <style>
        body { font-family: monospace; max-width: 600px; margin: 2rem auto; background: #0d1117; color: #c9d1d9; }
        h1 { color: #58a6ff; }
        a { color: #58a6ff; }
        code { background: #161b22; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>Mozhi API Server</h1>
    <p>API is running. See endpoints below:</p>
    <ul>
        <li><code>GET /api/items</code> - List all items</li>
        <li><code>GET /api/items/1</code> - Get item by ID</li>
        <li><code>POST /api/items</code> - Create new item</li>
        <li><code>GET /api/health</code> - Health check</li>
    </ul>
    <p><a href="/api/items">View /api/items</a></p>
</body>
</html>
