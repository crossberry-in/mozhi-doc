name: Build & Publish Mozhi Package Registry

on:
  push:
    branches: [main]
    paths:
      - 'pkg/**'
      - 'registry/**'
      - 'scripts/**'
      - '.github/workflows/registry.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pkg/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "registry-pages"
  cancel-in-progress: false

jobs:
  # ============================================================
  # Job 1: Validate all packages
  # ============================================================
  validate:
    name: Validate Packages
    runs-on: ubuntu-latest
    outputs:
      pkg-count: ${{ steps.count.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate package.toml files
        run: |
          echo "=== Validating packages ==="
          ERRORS=0
          for toml in pkg/*/package.toml; do
            [ -f "$toml" ] || continue
            dir=$(dirname "$toml")
            name=$(basename "$dir")
            echo "  Checking: $name"
            
            # Check required fields
            if ! grep -q '^version' "$toml"; then
              echo "  ✗ $name: missing 'version' in package.toml"
              ERRORS=$((ERRORS + 1))
            fi
            if ! grep -q '^description' "$toml"; then
              echo "  ✗ $name: missing 'description' in package.toml"
              ERRORS=$((ERRORS + 1))
            fi
            if ! grep -q '^name' "$toml"; then
              echo "  ✗ $name: missing 'name' in package.toml"
              ERRORS=$((ERRORS + 1))
            fi
            
            # Check for src/mod.mz
            if [ ! -f "$dir/src/mod.mz" ]; then
              echo "  ⚠ $name: no src/mod.mz (recommended)"
            fi
          done
          
          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "✗ $ERRORS validation error(s) found"
            exit 1
          fi
          echo ""
          echo "✓ All packages valid"

      - name: Count packages
        id: count
        run: |
          COUNT=$(find pkg -maxdepth 2 -name "package.toml" | wc -l | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT packages"

  # ============================================================
  # Job 2: Build registry index
  # ============================================================
  build-index:
    name: Build Registry Index
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make scripts executable
        run: chmod +x scripts/*.sh registry/src/server.py

      - name: Build registry
        run: |
          bash scripts/build-registry.sh

      - name: Validate JSON
        run: |
          python3 -m json.tool registry/mz-registry.json > /dev/null
          echo "✓ JSON valid"
          python3 -c "
          import json
          d = json.load(open('registry/mz-registry.json'))
          print(f'✓ Registry: {len(d[\"packages\"])} packages')
          for p in d['packages']:
              print(f'  - {p[\"name\"]} v{p[\"version\"]} ({p[\"category\"]})')
          "

      - name: Commit registry back to main
        if: github.event_name == 'push'
        run: |
          git config user.name "mozhi-bot"
          git config user.email "mozhi-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain registry/)" ]; then
            git add registry/
            git commit -m "chore(registry): rebuild index (${{ needs.validate.outputs.pkg-count }} packages)

          Generated by GitHub Actions
          Triggered by: ${{ github.sha }}"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Upload registry artifact
        uses: actions/upload-artifact@v4
        with:
          name: registry
          path: registry/

  # ============================================================
  # Job 3: Publish to GitHub Pages
  # ============================================================
  publish:
    name: Publish to GitHub Pages
    needs: build-index
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Re-fetch with the registry commit from the bot
          ref: main

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Rebuild registry (in case bot committed)
        run: bash scripts/build-registry.sh

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: registry/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Show deployment URL
        run: |
          echo ""
          echo "============================================================"
          echo "  Registry Published!"
          echo "============================================================"
          echo ""
          echo "  URL: ${{ steps.deploy.outputs.page_url }}mz-registry.json"
          echo ""
          echo "  Packages: ${{ needs.build-index.outputs.pkg-count }}"
          echo ""
          echo "  Install with:"
          echo "    pkg registry add mozhi ${{ steps.deploy.outputs.page_url }}mz-registry.json --default"
          echo "    pkg install <package-name>"
          echo "============================================================"

  # ============================================================
  # Job 4: PR comment (on pull requests only)
  # ============================================================
  pr-comment:
    name: Comment on PR
    needs: [validate, build-index]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build registry
        run: bash scripts/build-registry.sh

      - name: Generate PR comment
        id: comment
        run: |
          COMMENT=$(python3 << 'PYEOF'
          import json
          d = json.load(open('registry/mz-registry.json'))
          pkgs = d['packages']
          
          lines = [
              f"## 📦 Mozhi Package Registry — PR Summary",
              "",
              f"**{len(pkgs)} packages** in registry:",
              "",
              "| Package | Version | Category | Description |",
              "|---------|---------|----------|-------------|",
          ]
          
          for p in pkgs:
              desc = p['description'][:60]
              if len(p['description']) > 60:
                  desc += "..."
              lines.append(f"| `{p['name']}` | v{p['version']} | {p['category']} | {desc} |")
          
          lines.extend([
              "",
              f"**Total modules:** {sum(len(p['modules']) for p in pkgs)}",
              f"**Total exports:** {sum(len(p['exports']) for p in pkgs)}",
              "",
              "Once merged, the registry will be published to GitHub Pages automatically.",
          ])
          
          print('\n'.join(lines))
          PYEOF
          )
          
          # Write to file for the comment action
          echo "$COMMENT" > /tmp/comment.md

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('/tmp/comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
