[package]
name = "js-sdk"
version = "1.0.0"
category = "interop"
description = "JavaScript/NPM interoperability for Mozhi — import JS modules, NPM packages, call JS functions from Mozhi"
license = "MIT"
edition = "2024"
author = "crossberry-in"

[modules]
index = "Main entry point"
resolver = "Node-compatible module resolution"
loader = "ESM/CJS module loader"
bridge = "Mozhi ↔ JS runtime bridge"
value = "Bidirectional type conversion"
promise = "Promise ↔ Future bridge"
callback = "Mozhi fn → JS callback wrapper"
handles = "JS object handle management"
runtime = "Main runtime with Proxy access"

[exports]
mz_js_load = "bridge.mz_js_load"
mz_js_export = "bridge.mz_js_export"
mz_js_call = "bridge.mz_js_call"
mz_js_method = "bridge.mz_js_method"
mz_js_get = "bridge.mz_js_get"
mz_js_set = "bridge.mz_js_set"
mz_js_await = "bridge.mz_js_await"
mz_js_callback = "bridge.mz_js_callback"
mzToJs = "value.mzToJs"
jsToMz = "value.jsToMz"
resolve = "resolver.resolve"
load = "loader.load"
MozhiJsRuntime = "runtime.MozhiJsRuntime"
