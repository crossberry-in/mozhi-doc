[package]
name = "mznn"
version = "1.1.0"
category = "science"
description = "Mozhi Neural Network — binary distribution, no source code needed"
license = "MIT"
edition = "2024"
repository = "https://github.com/crossberry-in/mznn"
release = "v1.1.0"
binary = true

[modules]
mod = "Binary neural network: demo, train, emit scripts"

[exports]
demo = "mod.demo"
demo_python = "mod.demo_python"
demo_js = "mod.demo_js"
demo_all = "mod.demo_all"
train = "mod.train"
info = "mod.info"
emit_python = "mod.emit_python"
emit_js = "mod.emit_js"
emit_mz = "mod.emit_mz"
languages = "mod.languages"
run_xor_pipeline = "mod.run_xor_pipeline"
