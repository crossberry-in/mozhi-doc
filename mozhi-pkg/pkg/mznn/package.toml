[package]
name = "mznn"
version = "3.0.0"
category = "science"
description = "mznn in Mozhi - a pure-Mozhi neural network library: activations, losses, SGD/Adam/AdamW, Sequential, train/predict, save/load"
license = "MIT"
edition = "2024"
repository = "https://github.com/crossberry-in/mznn"

[modules]
mod = "Pure Mozhi NN: Sequential, Linear, activations, losses, optimizers, train, predict, save/load"

[exports]
version = "mod.version"
info = "mod.info"
Linear = "mod.Linear"
Sequential = "mod.Sequential"
forward = "mod.forward"
predict = "mod.predict"
train = "mod.train"
mse_loss = "mod.mse_loss"
cross_entropy = "mod.cross_entropy"
binary_cross_entropy = "mod.binary_cross_entropy"
accuracy = "mod.accuracy"
save = "mod.save"
load = "mod.load"
num_params = "mod.num_params"
