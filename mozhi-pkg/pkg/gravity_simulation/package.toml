[package]
name = "gravity_simulation"
version = "1.0.0"
category = "science"
description = "N-body physics simulation: gravity, springs, electrostatics, collisions, with SVG/HTML rendering"
license = "MIT"
edition = "2024"

[modules]
mod = "Core: body, world, step, forces, collisions, energy"
presets = "Pre-configured scenarios: solar system, pendulum, three-body, etc."
renderer = "Visualization: SVG, HTML canvas animation, ASCII, JSON export"

[exports]
body = "mod.body"
world = "mod.world"
step = "mod.step"
run_steps = "mod.run_steps"
kinetic_energy = "mod.kinetic_energy"
potential_energy = "mod.potential_energy"
total_energy = "mod.total_energy"
simulate_trajectory = "mod.simulate_trajectory"
render_svg = "renderer.render_svg"
render_html = "renderer.render_html"
render_ascii = "renderer.render_ascii"
export_json = "renderer.export_json"
solar_system = "presets.solar_system"
binary_stars = "presets.binary_stars"
pendulum = "presets.pendulum"
double_pendulum = "presets.double_pendulum"
three_body = "presets.three_body"
bouncing_balls = "presets.bouncing_balls"
electrostatic_charges = "presets.electrostatic_charges"
projectile = "presets.projectile"
