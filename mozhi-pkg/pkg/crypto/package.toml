[package]
name = "crypto"
version = "1.0.0"
category = "crypto"
description = "Cryptography helpers — MD5, SHA-256, base64, UUID, file checksums"
license = "MIT"
edition = "2024"

[modules]
mod = "Crypto: hashing, encoding, UUID"

[exports]
md5 = "mod.md5"
sha256 = "mod.sha256"
sha1 = "mod.sha1"
base64_encode = "mod.base64_encode"
base64_decode = "mod.base64_decode"
uuid = "mod.uuid"
random_hex = "mod.random_hex"
file_sha256 = "mod.file_sha256"
