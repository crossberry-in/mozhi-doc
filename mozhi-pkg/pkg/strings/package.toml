[package]
name = "strings"
version = "1.0.0"
category = "text"
description = "String manipulation — reverse, capitalize, snake_case, slugify, pad, truncate"
license = "MIT"
edition = "2024"

[modules]
mod = "String utilities: 21 functions"

[exports]
