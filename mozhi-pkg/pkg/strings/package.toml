slugify = "mod.slugify"
repeat = "mod.repeat"
pad_left = "mod.pad_left"
pad_right = "mod.pad_right"
truncate = "mod.truncate"
count = "mod.count"
starts_with = "mod.starts_with"
ends_with = "mod.ends_with"
