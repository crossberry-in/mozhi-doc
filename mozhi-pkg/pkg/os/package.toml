[package]
name = "os"
version = "1.0.0"
category = "os"
description = "Full OS control: system info, processes, filesystem, network, users, power, packages, services, cron"
license = "MIT"
edition = "2024"

[modules]
system = "OS detection, hostname, uptime, memory, disk, env vars"
process = "Process list, kill, spawn, top CPU/memory"
filesystem = "File ops: copy, move, delete, walk, chmod, find, disk usage"
network = "Interfaces, IP, MAC, gateway, DNS, ping, port scan, connections"
user = "Current user, groups, home, root check, user management"
power = "Shutdown, reboot, sleep, hibernate, lock, battery, brightness"
package_manager = "Detect: apt/dnf/pacman/brew/winget. Install, remove, update, search"
service = "systemd/launchd/Windows: list, start, stop, restart, enable, logs"
cron = "Crontab, at jobs, systemd timers, Windows Task Scheduler"
mod = "Main module — re-exports all functions with prefixes"

[exports]
os_type = "mod.os_type"
system_info = "mod.system_info"
hostname = "mod.hostname"
proc_list = "mod.proc_list"
proc_kill = "mod.proc_kill"
proc_spawn = "mod.proc_spawn"
fs_mkdir = "mod.fs_mkdir"
fs_copy = "mod.fs_copy"
fs_walk = "mod.fs_walk"
fs_find = "mod.fs_find"
net_primary_ip = "mod.net_primary_ip"
net_ping = "mod.net_ping"
net_port_scan = "mod.net_port_scan"
user_current = "mod.user_current"
user_is_root = "mod.user_is_root"
power_shutdown = "mod.power_shutdown"
power_reboot = "mod.power_reboot"
power_battery_status = "mod.power_battery_status"
pkg_detect = "mod.pkg_detect"
pkg_install = "mod.pkg_install"
pkg_update = "mod.pkg_update"
svc_list = "mod.svc_list"
svc_restart = "mod.svc_restart"
cron_list = "mod.cron_list"
cron_daily_at = "mod.cron_daily_at"
